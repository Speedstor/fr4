# Tests the model, builds the documentation site, and publishes it to
# GitHub Pages.
#
# One setting has to be made by hand, once:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# After that, every push to main republishes the site at
#   https://speedstor.github.io/fr4/

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

# Never run two publishes at once, and never cancel one half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test the model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest ruff
      - run: ruff check .
      - run: python -m pytest

  build:
    name: Build the site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy -r requirements-docs.txt

      # The predictions page shows the model's own printout. Regenerate it
      # here so the published numbers always match the published code.
      - name: Refresh the model's printout
        run: python -m fr4sim > docs/model/report.txt

      # --strict turns a broken link or a missing page into a failed build.
      - name: Build
        run: mkdocs build --strict

      - name: Hand the site to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to publish
      id-token: write # to prove the publish came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
